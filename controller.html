<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background: #f0f4f8; padding: 20px; display: flex; justify-content: center; }
        .card { width: 100%; max-width: 400px; background: white; padding: 30px; border-radius: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 200px; border-radius: 15px; padding: 15px; border: 2px solid #ddd; margin-bottom: 20px; }
        button { width: 100%; padding: 20px; background: #56ab2f; color: white; border: none; border-radius: 50px; font-size: 1.5rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h3>ควบคุมการสุ่ม</h3>
        <textarea id="nameInput" placeholder="ใส่ชื่อพนักงาน..."></textarea>
        <select id="luckyAmount" style="width:100%; padding: 15px; margin-bottom: 20px;">
            <option value="1">1 ท่าน</option><option value="5">5 ท่าน</option>
        </select>
        <button id="drawBtn">เริ่มสุ่ม!</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const db = getDatabase(initializeApp({ databaseURL: "https://lucky-draw-45bdf-default-rtdb.firebaseio.com/" }));
        
        document.getElementById('drawBtn').onclick = async () => {
            await set(ref(db, 'drawData'), null); // ล้างค่าเก่า
            const names = document.getElementById('nameInput').value.split('\n').filter(n=>n.trim());
            const amount = document.getElementById('luckyAmount').value;
            set(ref(db, 'drawData'), { names, amount, time: Date.now() });
        };
    </script>
</body>
</html>
