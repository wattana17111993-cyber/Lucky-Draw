<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Controller - Farm</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://lucky-draw-45bdf-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.sendDraw = function() {
            const names = document.getElementById('nameInput').value.split('\n');
            const amount = document.getElementById('luckyAmount').value;
            set(ref(db, 'drawData'), { names, amount, timestamp: Date.now() });
            alert("ส่งคำสั่งสุ่มไปยังหน้าจอแล้ว!");
        }
    </script>
</head>
<body>
    <textarea id="nameInput"></textarea>
    <select id="luckyAmount"><option value="1">1</option></select>
    <button onclick="sendDraw()">สุ่ม!</button>
</body>
</html>
