<!DOCTYPE html>
<html lang="th">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background: #e0e5ec; padding: 20px; }
        .card { background: #e0e5ec; padding: 25px; border-radius: 20px; box-shadow: 9px 9px 16px rgb(163,177,198,-0.6), -9px -9px 16px rgba(255,255,255, 0.5); }
        textarea { width: 100%; height: 200px; border: none; border-radius: 10px; padding: 15px; background: #e0e5ec; box-shadow: inset 6px 6px 12px #b8b9be, inset -6px -6px 12px #ffffff; }
        button { width: 100%; margin-top: 20px; padding: 20px; border: none; border-radius: 15px; background: #6d5dfc; color: white; font-size: 1.2rem; cursor: pointer; transition: 0.3s; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="card">
        <h3>รายชื่อผู้เข้าร่วม</h3>
        <textarea id="nameInput" placeholder="ใส่ชื่อรายบรรทัด..."></textarea>
        <select id="luckyAmount" style="width: 100%; padding: 10px; margin-top: 15px;">
            <option value="1">1 ท่าน</option>
            <option value="5">5 ท่าน</option>
        </select>
        <button onclick="send()">สุ่มเลย!</button>
    </div>

    <script>
        function send() {
            const names = document.getElementById('nameInput').value.split('\n').filter(n=>n.trim());
            const amount = document.getElementById('luckyAmount').value;
            localStorage.setItem('songkranData', JSON.stringify({names, amount, time: Date.now()}));
        }
    </script>
</body>
</html>
