<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background: #efebe9; padding: 20px; }
        .panel { background: #fff; padding: 30px; border-radius: 30px; border: 3px solid #8d6e63; }
        textarea { width: 100%; height: 200px; border-radius: 15px; padding: 15px; font-size: 16px; border: 2px solid #8d6e63; }
        button { width: 100%; padding: 20px; border: none; border-radius: 50px; background: #56ab2f; color: white; font-size: 1.5rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="panel">
        <h3>รายชื่อในฟาร์ม</h3>
        <textarea id="nameInput"></textarea>
        <select id="luckyAmount" style="width: 100%; padding: 15px; margin-top: 10px;">
            <option value="1">1 ท่าน</option>
            <option value="5">5 ท่าน</option>
        </select>
        <button id="sendBtn">เริ่มสุ่ม!</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const db = getDatabase(initializeApp({ databaseURL: "https://lucky-draw-45bdf-default-rtdb.firebaseio.com/" }));
        
        document.getElementById('sendBtn').onclick = () => {
            const names = document.getElementById('nameInput').value.split('\n').filter(n=>n.trim());
            const amount = document.getElementById('luckyAmount').value;
            set(ref(db, 'drawData'), { names, amount, time: Date.now() });
            alert("ส่งคำสั่งแล้ว!");
        };
    </script>
</body>
</html>
