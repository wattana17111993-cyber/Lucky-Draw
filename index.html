<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Farm Lucky Draw - Premium Display</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { margin: 0; padding: 0; height: 100vh; overflow: hidden; font-family: 'Kanit', sans-serif; background: linear-gradient(135deg, #a8e063, #56ab2f); }
        
        /* ใบไม้ปลิว */
        .leaf { position: absolute; width: 40px; height: 40px; background: rgba(255,255,255,0.3); clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); animation: drift linear infinite; }
        @keyframes drift { 0% { transform: translate(-100px, 0) rotate(0deg); } 100% { transform: translate(110vw, 100vh) rotate(360deg); } }

        .container { position: relative; z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; }
        
        .main-card { background: rgba(255, 255, 255, 0.9); padding: 50px 80px; border-radius: 50px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); text-align: center; }
        h1 { font-size: 3.5rem; color: #1a4314; margin-bottom: 20px; }
        
        .winner-tag { background: #fff; padding: 20px 50px; border-radius: 100px; color: #2d5a27; font-size: 3rem; font-weight: 700; border: 4px solid #ffd700; margin: 15px; animation: pop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="leaves"></div>
    <div class="container">
        <div class="main-card">
            <h1 id="title-text">🐄 ลุ้นรับรางวัลจากฟาร์มโชคชัย 🌿</h1>
            <div id="result-area"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // Firebase Config
        const db = getDatabase(initializeApp({ databaseURL: "https://lucky-draw-45bdf-default-rtdb.firebaseio.com/" }));

        // สร้างใบไม้ปลิว
        for(let i=0; i<15; i++) {
            const leaf = document.createElement('div');
            leaf.className = 'leaf';
            leaf.style.left = Math.random() * 100 + 'vw';
            leaf.style.animationDuration = (Math.random() * 5 + 5) + 's';
            leaf.style.animationDelay = Math.random() * 5 + 's';
            document.getElementById('leaves').appendChild(leaf);
        }

        // ดึงข้อมูลสุ่ม
        onValue(ref(db, 'drawData'), (snapshot) => {
            const data = snapshot.val();
            if(data) {
                const area = document.getElementById('result-area');
                area.innerHTML = "";
                const winners = [...data.names].sort(() => 0.5 - Math.random()).slice(0, data.amount);
                
                winners.forEach((name, i) => {
                    setTimeout(() => {
                        const tag = document.createElement('div');
                        tag.className = 'winner-tag';
                        tag.innerText = "⭐ " + name;
                        area.appendChild(tag);
                        confetti({ particleCount: 150, spread: 70, origin: { y: 0.7 } });
                    }, i * 800);
                });
            }
        });
    </script>
</body>
</html>
