<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; 
            background: url('https://images.unsplash.com/photo-1500622944204-b135684e99fd?q=80&w=2000') center/cover;
            font-family: 'Kanit', sans-serif; overflow: hidden; 
        }
        
        /* กล่อง UI สุดหรู */
        .glass-box { 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(15px);
            padding: 50px 80px; 
            border-radius: 30px; 
            border: 4px solid #b8860b; /* สีทอง */
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); 
            text-align: center; 
            max-width: 90%;
            position: relative;
        }

        #status { font-size: 3rem; color: #1a4314; font-weight: 600; margin-bottom: 30px; }
        
        /* รายชื่อเรียงเป็นแถว */
        #result-area { 
            font-size: 2.5rem; color: #2d5a27; font-weight: 600;
            display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; 
        }
        .winner-item { display: flex; align-items: center; gap: 10px; animation: fadeIn 0.8s ease; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="glass-box">
        <h1 id="status">ผู้โชคดีคือ:</h1>
        <div id="result-area"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const db = getDatabase(initializeApp({ databaseURL: "https://lucky-draw-45bdf-default-rtdb.firebaseio.com/" }));

        onValue(ref(db, 'drawData'), async (snapshot) => {
            const data = snapshot.val();
            if(!data) return;

            const area = document.getElementById('result-area');
            area.innerHTML = "";
            
            let winners = [...data.names].sort(() => 0.5 - Math.random()).slice(0, data.amount);
            
            for(let name of winners) {
                const span = document.createElement('span');
                span.className = 'winner-item';
                // เรียงหน้าชื่อวัว และปิดท้ายด้วยใบไม้
                span.innerHTML = `<span>🐮 ${name}</span> 🌿`;
                area.appendChild(span);
                await new Promise(r => setTimeout(r, 600));
            }
        });
    </script>
</body>
</html>
