<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; height: 100%; font-family: 'Kanit', sans-serif; overflow: hidden; }
        
        /* แก้ไขที่นี่: กำหนดรูปพื้นหลังทุ่งหญ้าและวัว */
        .farm-bg { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: url('http://googleusercontent.com/image_collection/image_retrieval/2252351143905086305') center/cover;
            z-index: -1; 
        }

        .container { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .main-box { 
            background: rgba(255, 255, 255, 0.9); padding: 40px; border-radius: 40px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3); text-align: center; max-width: 85%;
            animation: fadeIn 0.8s;
        }

        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }

        /* แก้ไขที่นี่: เพิ่มไอคอนวัวลงหน้าชื่อ */
        .title-bar { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .cow-icon { width: 40px; height: 40px; }

        .winner-list { 
            font-size: 2.2rem; color: #1a4314; display: flex; flex-wrap: wrap; 
            justify-content: center; gap: 20px; margin-top: 20px;
        }
        .winner-item { padding: 10px 20px; background: rgba(255,255,255,0.8); border-radius: 50px; border: 2px solid #56ab2f; }
    </style>
</head>
<body>
    <div class="farm-bg"></div>
    <div class="container">
        <div class="main-box">
            <div class="title-bar">
                <img src="https://img.icons8.com/color/48/cow.png" class="cow-icon" alt="cow icon">
                <h1 id="title">ลุ้นโชคจากฟาร์มโชคชัย</h1>
                <img src="https://img.icons8.com/color/48/plant-under-sun.png" class="cow-icon" alt="leaf icon">
            </div>
            <div id="result-area" class="winner-list">
                ผู้โชคดี:
                </div>
        </div>
    </div>

    </body>
</html>
