<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; 
            background: linear-gradient(135deg, #a8e063, #56ab2f); 
            font-family: 'Kanit', sans-serif; overflow: hidden; 
        }
        .main-box { 
            background: rgba(255, 255, 255, 0.9); padding: 50px; border-radius: 40px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); text-align: center; max-width: 80%;
        }
        #status { font-size: 2rem; color: #1a4314; margin-bottom: 10px; }
        #countdown { font-size: 6rem; color: #d32f2f; font-weight: 700; height: 100px; }
        #result-area { 
            font-size: 2.2rem; color: #2d5a27; font-weight: 600;
            display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; 
        }
        .winner-item { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="main-box">
        <h1 id="status">พร้อมสำหรับรางวัลจากฟาร์มโชคชัย</h1>
        <div id="countdown"></div>
        <div id="result-area"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://lucky-draw-45bdf-default-rtdb.firebaseio.com/" });
        const db = getDatabase(app);

        onValue(ref(db, 'drawData'), async (snapshot) => {
            const data = snapshot.val();
            if(!data) {
                document.getElementById('result-area').innerHTML = "";
                document.getElementById('status').innerText = "รอคำสั่งสุ่ม...";
                return;
            }

            const status = document.getElementById('status');
            const countdown = document.getElementById('countdown');
            const area = document.getElementById('result-area');
            
            area.innerHTML = "";
            status.innerText = "กำลังเตรียมการสุ่ม...";
            
            for(let i=3; i>0; i--) {
                countdown.innerText = i;
                await new Promise(r => setTimeout(r, 1000));
            }
            countdown.innerText = "";
            status.innerText = "ผู้โชคดีคือ:";

            let winners = [...data.names].sort(() => 0.5 - Math.random()).slice(0, data.amount);
            for(let name of winners) {
                const span = document.createElement('span');
                span.className = 'winner-item';
                span.innerHTML = `🐮 ${name} 🌿`;
                area.appendChild(span);
                await new Promise(r => setTimeout(r, 800));
            }
        });
    </script>
</body>
</html>
