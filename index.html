<!DOCTYPE html>
<html lang="th">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Kanit', sans-serif; }
        
        /* พื้นหลังทุ่งหญ้าพริ้วไหว */
        .background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #799f08, #2d5a27);
            overflow: hidden;
        }
        .grass {
            position: absolute; bottom: 0; width: 100%; height: 40%;
            background: url('https://www.transparenttextures.com/patterns/grass.png'); /* ลายหญ้า */
            animation: sway 5s ease-in-out infinite alternate;
        }
        @keyframes sway {
            0% { transform: scaleY(1); }
            100% { transform: scaleY(1.05); }
        }

        .main-container {
            position: relative; z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh;
        }

        .box {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px 60px; border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center; font-size: 2.5rem; color: #2d5a27; font-weight: 600;
        }

        #result-area { margin-top: 30px; display: flex; flex-wrap: wrap; justify-content: center; }
        .winner-card {
            background: white; padding: 20px 40px; margin: 10px; border-radius: 20px;
            border: 3px solid #ffd700; font-size: 2rem; color: #2d5a27; font-weight: 700;
            animation: bounceIn 0.8s;
        }
        @keyframes bounceIn { 0% { transform: scale(0); } 70% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="background"><div class="grass"></div></div>
    
    <div class="main-container">
        <div class="box" id="title-box">
            🐄 ลุ้นรับรางวัลจากฟาร์มโชคชัย 🌿
        </div>
        <div id="result-area"></div>
    </div>

    <script>
        window.addEventListener('storage', (e) => {
            if (e.key === 'songkranData') {
                const {names, amount} = JSON.parse(e.newValue);
                const area = document.getElementById('result-area');
                const title = document.getElementById('title-box');
                area.innerHTML = "";
                title.innerText = "กำลังสุ่มรางวัล...";
                
                let winners = [...names].sort(() => 0.5 - Math.random()).slice(0, amount);
                
                setTimeout(() => {
                    title.innerText = "🎉 ผู้โชคดีคือ 🎉";
                    winners.forEach((name, i) => {
                        setTimeout(() => {
                            const div = document.createElement('div');
                            div.className = 'winner-card';
                            div.innerText = "🐮 " + name;
                            area.appendChild(div);
                            confetti({ particleCount: 100, spread: 70, origin: { y: 0.8 } });
                        }, i * 800);
                    });
                }, 1500);
            }
        });
    </script>
</body>
</html>
