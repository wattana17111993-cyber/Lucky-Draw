<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Kanit', sans-serif; }
        
        /* พื้นหลังฟาร์ม */
        .farm-bg { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: url('https://images.unsplash.com/photo-1500622944204-b135684e99fd?q=80&w=2000') center/cover;
            z-index: -1; 
        }
        
        /* กล่องแสดงผลตรงกลาง */
        .container { 
            display: flex; justify-content: center; align-items: center; height: 100vh; 
        }
        .main-box { 
            background: rgba(255, 255, 255, 0.9); padding: 40px; border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); text-align: center; max-width: 80%;
        }
        
        /* รายชื่อเรียงเป็นบรรทัด */
        .winner-list { 
            font-size: 2.5rem; color: #1a4314; font-weight: 600;
            display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;
            margin-top: 20px;
        }
        .winner-item { display: inline-flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>
    <div class="farm-bg"></div>
    <div class="container">
        <div class="main-box">
            <h1 id="title">🐄 ลุ้นรับรางวัลจากฟาร์มโชคชัย 🌿</h1>
            <div id="result-area" class="winner-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const db = getDatabase(initializeApp({ databaseURL: "https://lucky-draw-45bdf-default-rtdb.firebaseio.com/" }));

        onValue(ref(db, 'drawData'), (snapshot) => {
            const data = snapshot.val();
            if(data) {
                const area = document.getElementById('result-area');
                area.innerHTML = "ผู้โชคดี: ";
                
                let winners = [...data.names].sort(() => 0.5 - Math.random()).slice(0, data.amount);
                
                winners.forEach((name, i) => {
                    const span = document.createElement('span');
                    span.className = 'winner-item';
                    span.innerHTML = `<span>🐮 ${name}</span> ${i < winners.length - 1 ? '🌿' : ''}`;
                    area.appendChild(span);
                });
            }
        });
    </script>
</body>
</html>
