<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Songkran Display</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { background: linear-gradient(135deg, #3a7bd5, #00d2ff); color: white; font-family: 'Kanit', sans-serif; text-align: center; height: 100vh; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .winner-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .winner-card { background: white; color: #3a7bd5; padding: 20px 40px; border-radius: 20px; font-size: 2.5rem; font-weight: bold; border: 5px solid #ffd700; box-shadow: 0 10px 0 #c71585; animation: popIn 0.5s ease; }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <h1 id="title" style="font-size: 3rem;">💦 สงกรานต์สำราญใจ 💦</h1>
    <div id="result-area" class="winner-list"></div>

    <script>
        window.addEventListener('storage', (event) => {
            if (event.key === 'songkranData') {
                const data = JSON.parse(event.newValue);
                runDraw(data.names, data.amount);
            }
        });

        function runDraw(names, amount) {
            const area = document.getElementById('result-area');
            area.innerHTML = "";
            document.getElementById('title').innerText = "กำลังสุ่ม...";
            
            let pool = [...names].sort(() => 0.5 - Math.random());
            let winners = pool.slice(0, amount);

            setTimeout(() => {
                document.getElementById('title').innerText = "🎉 ผู้โชคดีคือ 🎉";
                winners.forEach((name, i) => {
                    setTimeout(() => {
                        const card = document.createElement('div');
                        card.className = 'winner-card';
                        card.innerText = name;
                        area.appendChild(card);
                        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                    }, i * 600);
                });
            }, 1000);
        }
    </script>
</body>
</html>
