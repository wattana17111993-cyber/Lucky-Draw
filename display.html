<!DOCTYPE html>
<html lang="th">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { 
            margin: 0; background: #0f2027; 
            background: linear-gradient(135deg, #203a43, #2c5364);
            font-family: 'Kanit', sans-serif; color: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container { 
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            padding: 40px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3); text-align: center; width: 80%;
        }
        .winner-card { 
            display: inline-block; margin: 15px; padding: 20px 40px;
            background: #fff; color: #2c5364; border-radius: 50px;
            font-size: 2rem; font-weight: 600; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="title">💦 รอลุ้นผู้โชคดี...</h1>
        <div id="result-area"></div>
    </div>

    <script>
        window.addEventListener('storage', (e) => {
            if (e.key === 'songkranData') {
                const {names, amount} = JSON.parse(e.newValue);
                const area = document.getElementById('result-area');
                area.innerHTML = "";
                document.getElementById('title').innerText = "✨ กำลังสุ่มรางวัล ✨";
                
                let winners = [...names].sort(() => 0.5 - Math.random()).slice(0, amount);
                
                setTimeout(() => {
                    document.getElementById('title').innerText = "🎉 ขอแสดงความยินดีด้วย! 🎉";
                    winners.forEach((name, i) => {
                        setTimeout(() => {
                            const div = document.createElement('div');
                            div.className = 'winner-card';
                            div.innerText = "⭐ " + name;
                            area.appendChild(div);
                            confetti({ particleCount: 100, spread: 70, origin: { y: 0.7 } });
                        }, i * 600);
                    });
                }, 1500);
            }
        });
    </script>
</body>
</html>
